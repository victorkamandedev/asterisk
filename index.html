<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Asterisk</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700&family=Rajdhani:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/style.css" />
</head>
<body>

<div id="card">

  <!-- Header -->
  <div id="header">
    <div class="header-corner left"></div>
    <div id="title-wrap">
      <span class="title-dot"></span>
      <h1 id="game-title">ASTERISK</h1>
      <span class="title-dot"></span>
    </div>
    <div class="header-corner right"></div>
  </div>

  <!-- Player panels -->
  <div id="player-panels">
    <div class="player-panel" id="panel-p1">
      <div class="panel-label">PLAYER 1</div>
      <div class="panel-orb p1-orb">
        <span class="orb-count" id="p1-count">1</span>
      </div>
    </div>

    <!-- Mode switcher in centre -->
    <div id="mode-row">
      <button id="btn-2p" class="active">2P</button>
      <button id="btn-ai">AI</button>
      <div id="diff-row" style="display:none">
        <button id="btn-easy" class="active diff-btn">EASY</button>
        <button id="btn-med" class="diff-btn">MED</button>
        <button id="btn-hard" class="diff-btn">HARD</button>
      </div>
    </div>

    <div class="player-panel right" id="panel-p2">
      <div class="panel-label" id="p2-label">PLAYER 2</div>
      <div class="panel-orb p2-orb">
        <span class="orb-count" id="p2-count">2</span>
      </div>
    </div>
  </div>

  <!-- Board -->
  <div id="board-wrap">
    <svg id="board" width="100%" viewBox="0 0 340 340" preserveAspectRatio="xMidYMid meet"></svg>
    <canvas id="confetti-canvas"></canvas>
  </div>

  <!-- Status bar -->
  <div id="status-bar">
    <span class="status-dash">·</span>
    <span id="status-text">PLAYER 1'S TURN</span>
    <span class="status-dash">·</span>
  </div>

  <!-- New game -->
  <div id="btn-row">
    <button id="btn-new-game">NEW GAME</button>
  </div>

</div>

<script type="module" src="src/main.js"></script>
</body>
</html>
